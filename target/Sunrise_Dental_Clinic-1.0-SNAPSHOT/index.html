<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Dental Clinic - Login</title>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #334155;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.12);
            border: 1px solid #bae6fd;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .brand-header {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            padding: 35px 25px;
            text-align: center;
            color: #ffffff;
        }

        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 4px;
        }

        .login-body {
            padding: 32px 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #334155;
            font-size: 0.88rem;
            margin-bottom: 8px;
        }

        /* Pure CSS Input Group */
        .input-group {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .input-group:focus-within {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .input-group-text {
            background-color: #f8fafc;
            color: #64748b;
            padding: 12px 14px;
            font-size: 0.95rem;
            border-right: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-control {
            width: 100%;
            border: none;
            outline: none;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #0f172a;
            background: transparent;
        }

        .btn-login {
            background-color: #0284c7;
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }

        .btn-login:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
        }

        /* Custom Alert Notification Styles */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-warning {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Clinic Brand Header -->
    <div class="brand-header">
        <div class="brand-logo">
            <i class="fa-solid fa-tooth"></i>
        </div>
        <h2 class="brand-title">Sunrise Dental</h2>
        <p class="brand-subtitle">Staff Portal Access</p>
    </div>

    <div class="login-body">
        <!-- Error & Status Dynamic Alerts -->
        <div id="alertContainer"></div>

        <!-- Login Form -->
        <form action="login" method="POST" autocomplete="off">
            <!-- Dummy hidden inputs to prevent auto-fill issues -->
            <input type="text" style="display:none" aria-hidden="true">
            <input type="password" style="display:none" aria-hidden="true">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input 
                        type="text" 
                        id="username"
                        name="username"
                        autocomplete="new-password"
                        class="form-control" 
                        placeholder="Enter username" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        autocomplete="new-password"
                        class="form-control" 
                        placeholder="Enter password" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Clear input fields on page load
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        if (usernameInput) usernameInput.value = '';
        if (passwordInput) passwordInput.value = '';

        // URL Status/Error Message Handler
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const status = urlParams.get('status');
        const alertContainer = document.getElementById('alertContainer');

        let alertHtml = '';

        if (error === 'invalid') {
            alertHtml = `
                <div class="alert alert-danger" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <div>Invalid username or password. Please try again.</div>
                </div>`;
        } else if (error === 'dentist_not_found') {
            alertHtml = `
                <div class="alert alert-warning" role="alert">
                    <i class="fa-solid fa-user-doctor"></i>
                    <div>Dentist profile not found for this account.</div>
                </div>`;
        } else if (error === 'invalidrole') {
            alertHtml = `
                <div class="alert alert-warning" role="alert">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <div>Unauthorized role assigned to your account.</div>
                </div>`;
        } else if (error === 'unauthorized' || error === 'login_required') {
            alertHtml = `
                <div class="alert alert-warning" role="alert">
                    <i class="fa-solid fa-lock"></i>
                    <div>Please log in first to access the dashboard.</div>
                </div>`;
        } else if (status === 'logout') {
            alertHtml = `
                <div class="alert alert-success" role="alert">
                    <i class="fa-solid fa-circle-check"></i>
                    <div>You have been successfully logged out.</div>
                </div>`;
        }

        if (alertHtml && alertContainer) {
            alertContainer.innerHTML = alertHtml;
        }
    });
</script>

</body>
</html>
